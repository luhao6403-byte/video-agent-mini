spring.application.name=video-agent-mini
server.port=9091
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3307/video_agent_mini?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=dovideo
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.data.redis.host=localhost
spring.data.redis.port=16379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s

minio.endpoint=http://localhost:9000
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=video-agent-mini

rocketmq.name-server=127.0.0.1:9914
rocketmq.producer.group=video-agent-mini-producer
rocketmq.producer.send-message-timeout=3000